name: e2e-windows

# Cold-install smoke for neat.is on Windows — the one platform no other CI covers
# (everything else is ubuntu-only; macOS is covered by the local neat-breaker). By
# default it builds the checked-out ref and installs the packed tarballs globally,
# so it tests main (or a branch) before anything is published; `source: npm`
# installs neat.is@<version> from the registry instead. Either way it drives the
# real flow: init → orchestrator/daemon → REST → read verbs → teardown, asserting
# a clean exit with no orphaned daemon and no held port.
#
# Dispatch-only until it's proven green, matching the e2e-capture / e2e-brief
# gating discipline — a Windows-specific break (path separators, detached spawn,
# port binding) should surface here on demand, not ship red on every PR.

on:
  workflow_dispatch:
    inputs:
      source:
        description: 'what to install: main (build + pack the checked-out ref) or npm (the registry)'
        type: choice
        options: [main, npm]
        default: main
      version:
        description: 'with source=npm: neat.is version or dist-tag (e.g. 0.10.9, latest)'
        default: 'latest'
        required: false

jobs:
  # Built and packed on Linux, as publish.yml builds what users install; the
  # Windows job installs those tarballs. (The repo's own build scripts are
  # POSIX-shell, so building on Windows would test a contributor setup, not
  # what a user installs.)
  pack:
    if: inputs.source == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npx turbo build --concurrency=1
      - name: Pack the eight publishable packages
        run: |
          mkdir -p tgz
          for p in types core mcp neat.is claude-skill otel-node instrumentation-registry web; do
            (cd "packages/$p" && npm pack --pack-destination ../../tgz)
          done
          ls -la tgz
      - uses: actions/upload-artifact@v4
        with:
          name: neat-tarballs
          path: tgz/*.tgz
          retention-days: 3

  windows-cold:
    needs: pack
    # Runs after pack, or alone when source=npm (pack is skipped then).
    if: always() && (needs.pack.result == 'success' || inputs.source == 'npm')
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - uses: actions/download-artifact@v4
        if: inputs.source == 'main'
        with:
          name: neat-tarballs
          path: ${{ runner.temp }}/tgz

      - name: Use the packed tarballs
        if: inputs.source == 'main'
        run: |
          $list = (Get-ChildItem (Join-Path $env:RUNNER_TEMP 'tgz') -Filter *.tgz | ForEach-Object { $_.FullName }) -join ' '
          "NEAT_INSTALL=$list" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "installing: $list"

      - name: Choose the registry version
        if: inputs.source == 'npm'
        run: |
          "NEAT_INSTALL=neat.is@${{ inputs.version }}" | Out-File -FilePath $env:GITHUB_ENV -Append

      - name: Cold-install neat.is (global, as a user would)
        run: |
          # Leave the checkout so a global install can't resolve against the workspace.
          Set-Location $env:RUNNER_TEMP
          npm install -g ($env:NEAT_INSTALL -split ' ')
          if ($LASTEXITCODE -ne 0) { throw "global install exited $LASTEXITCODE" }
          $cmd = Get-Command neat -ErrorAction SilentlyContinue
          if (-not $cmd) { throw "neat is not on PATH after global install" }
          Write-Host "neat resolved to $($cmd.Source)"
          # Exit code is the honest 'the bin runs' signal — npm's Windows shim does
          # not reliably surface a native command's stdout through a pwsh pipeline,
          # so gate on the code and just log whatever output we do capture.
          $ver = (& neat --version 2>&1 | Out-String).Trim()
          if ($LASTEXITCODE -ne 0) { throw "neat --version exited $LASTEXITCODE" }
          Write-Host "neat --version -> '$ver'"
          & neat --help *> $null
          if ($LASTEXITCODE -ne 0) { throw "neat --help exited $LASTEXITCODE" }

      - name: Build a throwaway fixture project
        run: |
          $fx = Join-Path $PWD 'fixture'
          $svc = Join-Path $fx 'svc'
          New-Item -ItemType Directory -Force -Path $svc | Out-Null
          @'
          const express = require('express')
          const app = express()
          app.get('/health', (_q, r) => r.json({ ok: true }))
          app.listen(3000)
          '@ | Set-Content -Path (Join-Path $svc 'index.js')
          @'
          { "name": "svc", "version": "1.0.0", "dependencies": { "express": "^4.19.0" } }
          '@ | Set-Content -Path (Join-Path $svc 'package.json')
          "NEAT_FIXTURE=$fx" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "fixture at $fx"

      - name: neat init (extract + register)
        run: |
          neat init "$env:NEAT_FIXTURE"
          if ($LASTEXITCODE -ne 0) { throw "neat init exited $LASTEXITCODE" }

      - name: Launch the orchestrator and wait for the REST API
        run: |
          # Launch through cmd.exe so the npm-generated `neat.cmd` shim resolves and
          # runs natively — Start-Process against the raw Get-Command source can land
          # on neat.ps1 / the extensionless bash shim, which it can't execute (the
          # daemon then never runs). `neat <path>` detaches the daemon and returns,
          # so cmd /c exits and the daemon lives on.
          Write-Host "neat resolves to: $((Get-Command neat -ErrorAction SilentlyContinue).Source)"
          Start-Process -FilePath 'cmd.exe' -ArgumentList '/c', 'neat', $env:NEAT_FIXTURE `
            -RedirectStandardOutput (Join-Path $env:NEAT_FIXTURE 'orch.out.log') `
            -RedirectStandardError  (Join-Path $env:NEAT_FIXTURE 'orch.err.log') `
            -NoNewWindow | Out-Null
          $up = $false
          for ($i = 0; $i -lt 60; $i++) {
            try {
              $r = Invoke-WebRequest -UseBasicParsing -TimeoutSec 2 http://127.0.0.1:8080/projects
              if ($r.StatusCode -eq 200) { $up = $true; break }
            } catch { Start-Sleep -Seconds 2 }
          }
          if (-not $up) { throw "daemon REST never came up on 127.0.0.1:8080 within ~120s" }
          Write-Host "daemon REST is up"

      - name: Graph serves nodes
        run: |
          $g = Invoke-RestMethod -TimeoutSec 5 http://127.0.0.1:8080/graph
          $n = @($g.nodes).Count
          Write-Host "graph nodes: $n"
          if ($n -lt 1) { throw "graph served 0 nodes" }

      - name: Read verbs exit 0
        run: |
          # From inside the project: a command resolves the project at or above the
          # cwd (ADR-273), and outside one it errors rather than picking a default.
          Set-Location $env:NEAT_FIXTURE
          foreach ($cmd in @('list', 'ps', 'divergences --json', 'search svc --json')) {
            Write-Host "== neat $cmd =="
            Invoke-Expression "neat $cmd" | Out-Null
            if ($LASTEXITCODE -ne 0) { throw "neat $cmd exited $LASTEXITCODE" }
          }

      - name: Teardown — stop the daemon, assert port 8080 freed
        run: |
          # discover the registered project name rather than assuming it — uninstall
          # takes the name, not the path. Capture through cmd so the npm shim's
          # stdout actually reaches us (a bare `neat list` pipes empty under pwsh).
          $listing = (cmd /c neat list 2>&1 | Out-String)
          $line = ($listing -split "`n") | Where-Object { $_ -match 'running' } | Select-Object -First 1
          $proj = if ($line) { (($line -split '\s+') | Where-Object { $_ })[0] } else { 'fixture' }
          Write-Host "stopping project '$proj'"
          neat uninstall $proj
          Start-Sleep -Seconds 4
          $held = Get-NetTCPConnection -State Listen -LocalPort 8080 -ErrorAction SilentlyContinue
          if ($held) { throw "port 8080 still held after teardown (orphaned daemon)" }
          Write-Host "port 8080 freed — no orphan"

      - name: errors.ndjson canary is empty
        run: |
          $err = Join-Path $env:NEAT_FIXTURE 'neat-out/errors.ndjson'
          if (Test-Path $err) {
            $lines = @(Get-Content $err).Count
            Write-Host "errors.ndjson lines: $lines"
            if ($lines -gt 0) { Get-Content $err; throw "errors.ndjson is not empty" }
          } else {
            Write-Host "no errors.ndjson written (clean)"
          }

      - name: Diagnostics on failure
        if: failure()
        run: |
          if ($env:NEAT_FIXTURE) {
            foreach ($f in @('orch.out.log', 'orch.err.log', 'neat-out/daemon.log', 'neat-out/errors.ndjson')) {
              $p = Join-Path $env:NEAT_FIXTURE $f
              Write-Host "===== $f ====="
              if (Test-Path $p) { Get-Content $p -Tail 200 } else { Write-Host '(absent)' }
            }
          } else {
            Write-Host 'no fixture set — failed before the orchestrator launched'
          }
          Write-Host '===== neat list ====='; cmd /c neat list 2>&1 | Out-String | Write-Host
          Write-Host '===== neat ps ====='; cmd /c neat ps 2>&1 | Out-String | Write-Host
          Write-Host '===== listening ports (8080/4318/6328) ====='
          Get-NetTCPConnection -State Listen -ErrorAction SilentlyContinue |
            Where-Object { $_.LocalPort -in 8080, 4318, 6328 } |
            Format-Table -AutoSize | Out-String | Write-Host
