name: Nightly

# Publishes a daily build of `main` to npm under the `nightly` dist-tag, the
# TypeScript-nightly way: version `<next-patch>-dev.<YYYYMMDD>`, prerelease, so
# `npm install neat.is` (= `latest`) never resolves to it. Install the channel
# with `npx neat.is@nightly`.
#
# The version is stamped in CI and never committed (git history stays clean; only
# npm carries the `-dev` versions). The build/test/lint gate is light by design —
# a nightly is published-then-tested: the flow-harness validates the published
# artifact downstream and promotes a green one to `@next`.

on:
  schedule:
    - cron: '0 8 * * *' # ~midnight PST, daily
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    # Never publish from a fork.
    if: github.repository == 'NEAT-Technologies/Neat'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Stamp the nightly version
        id: ver
        run: |
          version="$(node scripts/set-nightly-version.mjs)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Nightly version: $version"

      # Light gate — build, test, lint (separate steps so build fully completes
      # before test, same as ci.yml). The deep flow-harness gates `@next`, not this.
      - run: npx turbo build
      - run: npx turbo test
      - run: npx turbo lint

      - name: Publish the lockstep packages under @nightly
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          # A publish returning is not the same as the version being resolvable:
          # a large tarball (@neat.is/web bundles .next/standalone) takes minutes
          # to propagate to where `npm view <pkg>@<version>` finds it. The umbrella
          # publishes seconds after its deps but can resolve ahead of them, so a
          # consumer installing in that window gets "No matching version found for
          # <dep>". Wait for each published version to become resolvable before
          # advancing — and FAIL the job if it never does, so a temporarily
          # uninstallable @nightly never finishes green.
          wait_resolvable() {
            local name="$1" version="$2"
            local deadline=$(( $(date +%s) + 600 ))
            until npm view "${name}@${version}" version > /dev/null 2>&1; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "  ERROR: ${name}@${version} not resolvable after 10m — registry propagation stalled" >&2
                return 1
              fi
              echo "  waiting for ${name}@${version} to propagate…"
              sleep 10
            done
            echo "  resolvable: ${name}@${version}"
          }

          publish_one() {
            local dir="$1"
            local name version
            name=$(node -p "require('./${dir}/package.json').name")
            version=$(node -p "require('./${dir}/package.json').version")
            echo
            echo "── ${name}@${version} ──"
            # Idempotent: a same-day re-run finds the version already published
            # (and therefore already resolvable, so no wait is needed).
            if npm view "${name}@${version}" version > /dev/null 2>&1; then
              echo "  already on registry, skipping"
              return 0
            fi
            ( cd "$dir" && npm publish --tag nightly )
            echo "  published (nightly)"
            wait_resolvable "$name" "$version"
          }

          # Dependency order. `@neat.is/instrumentation-registry` is NOT bumped —
          # it stays at its own 1.0.0 line, already on the registry, referenced
          # via `^1.0.0` by the dev packages.
          publish_one packages/types
          publish_one packages/core
          publish_one packages/mcp
          publish_one packages/claude-skill
          publish_one packages/web
          publish_one packages/neat.is
          publish_one packages/otel-node

          # Final gate: every dependency the umbrella pins must resolve before the
          # job ends, so a fresh `npm i neat.is@nightly` right after can't hit a
          # dep-before-dependent propagation window. (otel-node is last and is not
          # a neat.is dependency, so it isn't in this set.)
          echo
          echo "── asserting neat.is@nightly dependencies resolve ──"
          mapfile -t _deps < <(node -p "Object.entries(require('./packages/neat.is/package.json').dependencies||{}).filter(([n])=>n.startsWith('@neat.is/')).map(([n,v])=>n+' '+v.replace(/^[\^~]/,'')).join('\n')")
          for _d in "${_deps[@]}"; do
            [ -n "$_d" ] || continue
            wait_resolvable "${_d% *}" "${_d#* }"
          done

      - name: Summary
        run: |
          v="${{ steps.ver.outputs.version }}"
          {
            echo "### Nightly published"
            echo ""
            echo "- version: \`$v\`"
            echo "- install: \`npx neat.is@nightly\` (or \`@$v\` exact)"
            echo "- commit: \`${{ github.sha }}\` (npm \`gitHead\` carries it too)"
          } >> "$GITHUB_STEP_SUMMARY"
