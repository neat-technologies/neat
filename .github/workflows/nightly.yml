name: Nightly

# Publishes a daily build of `main` to npm under the `nightly` dist-tag, the
# TypeScript-nightly way: version `<next-patch>-dev.<YYYYMMDD>`, prerelease, so
# `npm install neat.is` (= `latest`) never resolves to it. Install the channel
# with `npx neat.is@nightly`.
#
# The version is stamped in CI and never committed (git history stays clean; only
# npm carries the `-dev` versions). The build/test/lint gate is light by design —
# a nightly is published-then-tested: the flow-harness validates the published
# artifact downstream and promotes a green one to `@next`.

on:
  schedule:
    - cron: '0 8 * * *' # ~midnight PST, daily
  workflow_dispatch:

jobs:
  nightly:
    runs-on: ubuntu-latest
    # Never publish from a fork.
    if: github.repository == 'NEAT-Technologies/Neat'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci

      - name: Stamp the nightly version
        id: ver
        run: |
          version="$(node scripts/set-nightly-version.mjs)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Nightly version: $version"

      # Light gate — build, test, lint (separate steps so build fully completes
      # before test, same as ci.yml). The deep flow-harness gates `@next`, not this.
      - run: npx turbo build
      - run: npx turbo test
      - run: npx turbo lint

      # Prove the stamped build installs and works before any of it is
      # published: pack all eight packages, install them fresh, and run
      # e2e/phase0 against the installed bins (e2e/release/README.md). A build
      # that only fails once installed never reaches @nightly.
      - name: Prove the artifact
        run: ./e2e/release/run.sh

      - name: Publish the lockstep packages under @nightly
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          set -euo pipefail

          # A publish returning is not the same as the version being resolvable:
          # npm now routinely takes many minutes to surface a large tarball to
          # `npm view` (#1270 saw ~50 for a release; the 10-19 and 10-20 nightlies
          # timed out at 10 waiting on core and never published the rest). npm
          # doesn't need a dependency resolvable to publish a dependent, only to
          # install it, so: publish every non-umbrella package, wait once for all
          # of them, then publish the umbrella last. A slow core no longer strands
          # mcp/web/claude-skill/otel-node, and the umbrella's @nightly never
          # points at deps that don't resolve yet. The job fails if they never do.
          WAIT_SECONDS=3600
          wait_resolvable() {
            local name="$1" version="$2"
            local deadline=$(( $(date +%s) + WAIT_SECONDS ))
            until npm view "${name}@${version}" version > /dev/null 2>&1; do
              if [ "$(date +%s)" -ge "$deadline" ]; then
                echo "  ERROR: ${name}@${version} not resolvable after $((WAIT_SECONDS / 60))m — registry propagation stalled" >&2
                return 1
              fi
              echo "  waiting for ${name}@${version} to propagate…"
              sleep 20
            done
            echo "  resolvable: ${name}@${version}"
          }

          publish_one() {
            local dir="$1"
            local name version out
            name=$(node -p "require('./${dir}/package.json').name")
            version=$(node -p "require('./${dir}/package.json').version")
            echo
            echo "── ${name}@${version} ──"
            # Idempotent: a same-day re-run finds the version already published.
            if npm view "${name}@${version}" version > /dev/null 2>&1; then
              echo "  already on registry, skipping"
              return 0
            fi
            if out=$( cd "$dir" && npm publish --tag nightly 2>&1 ); then
              echo "  published (nightly)"
              return 0
            fi
            # npm still processing an earlier publish of this version answers 403
            # with this wording: the version is there (#1270). Any other 403 is a
            # real auth failure and stays fatal.
            if printf '%s' "$out" | grep -qi 'cannot publish over the previously published version'; then
              echo "  already published — npm is still processing it, continuing"
              return 0
            fi
            printf '%s\n' "$out" >&2
            return 1
          }

          version_of() { node -p "require('./$1/package.json').name + ' ' + require('./$1/package.json').version"; }

          # Everything but the umbrella. `@neat.is/instrumentation-registry` is
          # NOT published here: it rides its own version line (publish.yml), and
          # a first publish under --tag nightly would leave its `latest` behind.
          DEPS="packages/types packages/core packages/mcp packages/claude-skill packages/web packages/otel-node"
          for d in $DEPS; do publish_one "$d"; done

          echo
          echo "── waiting for the dependencies to resolve ──"
          for d in $DEPS; do
            read -r n v < <(version_of "$d")
            wait_resolvable "$n" "$v"
          done

          publish_one packages/neat.is
          read -r n v < <(version_of packages/neat.is)
          wait_resolvable "$n" "$v"

      - name: Summary
        run: |
          v="${{ steps.ver.outputs.version }}"
          {
            echo "### Nightly published"
            echo ""
            echo "- version: \`$v\`"
            echo "- install: \`npx neat.is@nightly\` (or \`@$v\` exact)"
            echo "- commit: \`${{ github.sha }}\` (npm \`gitHead\` carries it too)"
          } >> "$GITHUB_STEP_SUMMARY"
