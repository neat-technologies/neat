name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      # Import boundaries (docs/contracts/substrate.md): no cycles, no upward imports.
      - run: node scripts/check-layers.mjs

      - run: npx turbo build

      - run: npx turbo test

      - run: npx turbo lint

      - run: npx turbo typecheck

  neat-otel:
    uses: ./.github/workflows/neat-otel-test.yml
