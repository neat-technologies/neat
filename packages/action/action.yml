name: 'NEAT graph impact'
description: 'Post the NEAT graph delta (routes/tables/dependencies) and blast radius of a pull request as a sticky comment.'
author: 'NEAT'
branding:
  icon: 'git-pull-request'
  color: 'blue'
inputs:
  github-token:
    description: 'Token used to post the PR comment. Needs pull-requests:write.'
    required: false
    default: ${{ github.token }}
  engine:
    description: 'The NEAT engine to extract the graph. A bare package name runs via npx; a path (e.g. a locally-built cli.cjs) runs directly.'
    required: false
    default: 'neat.is'
  scan-path:
    description: 'Subdirectory to scan, relative to the checkout root (default: the whole repo).'
    required: false
    default: ''
  neat-api-url:
    description: 'A connected NEAT host (any daemon serving /graph/*). When set, the comment becomes a verdict-first report weighted by production traffic (OBSERVED): it flags declared-vs-observed divergence and, for anything this PR removes or changes, detects observed breaks (production calling it). Unset falls back to the static graph-diff comment.'
    required: false
    default: ''
  neat-api-token:
    description: 'Bearer token for the connected NEAT host (neat-api-url). Sent as Authorization on the /graph/* requests so a self-hosted daemon on your own network — or the hosted plane — can require auth. Unset sends no auth (fine for a host that does not require it, or the static tier). Store it as a secret.'
    required: false
    default: ''
  tone:
    description: 'Voice of the verdict headline: "loud" (blunt) or "professional" (SFW). Same severity model and structure either way.'
    required: false
    default: 'loud'
  sniper-dispatch-url:
    description: 'Optional URL to dispatch NEAT Sniper at the findings. When set, the critical/minor tiers render a "Dispatch Sniper to fix these" link. The Action only points at this seam — it does not trigger or implement Sniper.'
    required: false
    default: ''
  graph-diff-url:
    description: 'Optional URL to the full graph diff for this PR. Rendered as a link when set, omitted otherwise.'
    required: false
    default: ''
  security:
    description: 'Check the PR for known vulnerabilities its code pulls in and post them, with the fix, as a second sticky comment. "on" or "off". Runs the engine inline (the advisory lookup is its one network call); falls back to neat-api-url when the engine has no security verbs.'
    required: false
    default: 'on'
  security-gate:
    description: '"report" (default) only comments. "fail" also fails the check when the PR introduces a known vulnerability in a dependency its code imports. A head-only scan never fails the check, since it cannot tell what the PR introduced.'
    required: false
    default: 'report'
  no-regression-gate:
    description: 'The pre-merge no-regression gate (ADR-277). "off" (default) does nothing. "report" posts the four conditions (blast radius bounded, test suite green, no new divergence, security scan clear) as a sticky comment without blocking. "fail" also fails the check when the verdict does not pass. A condition NEAT cannot evaluate counts as not passed (fail-closed). Needs a full checkout (fetch-depth: 0) so NEAT can read the base commit.'
    required: false
    default: 'off'
  tests-result:
    description: 'The result of your test job, for the gate''s test condition. Wire it as ${{ needs.<test-job>.result }}: "success" is a green suite, "failure" a red one. Anything else (cancelled, skipped, unset) leaves the condition unknown, which fails the gate closed when it blocks.'
    required: false
    default: ''
  gate-max-files:
    description: 'Blast-radius ceiling for the no-regression gate: the most changed files a passing PR may touch. Default 50.'
    required: false
    default: '50'
  gate-max-services:
    description: 'Blast-radius ceiling for the no-regression gate: the most services a passing PR may touch. Default 10.'
    required: false
    default: '10'
runs:
  using: 'composite'
  steps:
    - shell: bash
      run: node "${{ github.action_path }}/src/main.mjs"
      env:
        INPUT_GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_ENGINE: ${{ inputs.engine }}
        INPUT_SCAN_PATH: ${{ inputs.scan-path }}
        INPUT_NEAT_API_URL: ${{ inputs.neat-api-url }}
        INPUT_NEAT_API_TOKEN: ${{ inputs.neat-api-token }}
        INPUT_TONE: ${{ inputs.tone }}
        INPUT_SNIPER_DISPATCH_URL: ${{ inputs.sniper-dispatch-url }}
        INPUT_GRAPH_DIFF_URL: ${{ inputs.graph-diff-url }}
        INPUT_SECURITY: ${{ inputs.security }}
        INPUT_SECURITY_GATE: ${{ inputs.security-gate }}
        INPUT_NO_REGRESSION_GATE: ${{ inputs.no-regression-gate }}
        INPUT_GATE_TESTS: ${{ inputs.tests-result }}
        INPUT_GATE_MAX_FILES: ${{ inputs.gate-max-files }}
        INPUT_GATE_MAX_SERVICES: ${{ inputs.gate-max-services }}
